name: Publish po4a image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'po4a version to build'
        required: true
        default: '0.73'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    name: Publish po4a image v${{ inputs.version }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            PO4A_VERSION=${{ inputs.version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/po4a-action:${{ inputs.version }}
